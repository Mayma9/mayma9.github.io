eception and security robot off cloud APIs. Speech-to-text, the language model and text-to-speech now run on an NVIDIA Jetson Orin Nano with no network, in French and English.",metrics:[["1.5–4.6 s","per spoken reply"],["~30","tokens per second on the Jetson GPU"],["0","network calls"]],stack:["Whisper.cpp","Ollama","qwen2.5:3b","Piper","Python","Flask / FastAPI","SQLite","React","Jetson Orin Nano","Jira"],notes:{problem:"The prototype needed hosted APIs to hear, think and speak. When the connection dropped, the robot went silent.",built:"A complete local voice loop. Whisper handles speech-to-text, qwen2.5:3b runs under Ollama on the GPU, and Piper speaks the answer. A Python backend coordinates the three, with a React control interface. The robot has three modes (reception, security, restricted), each with its own French and English system prompt.",hard:[["A GPU driver bug","A confirmed NVIDIA bug in L4T 36.4 broke GPU buffer allocation. I ran the model through a CPU fallback, set up as a systemd override, until JetPack 6.2.2 fixed it."],["Hallucinated transcripts","Whisper invented text from corrupted audio. Cleaning the signal (NaN removal, clipping, a silence threshold) fixed it."],["Language bleed","English questions got French answers. Fully separate prompts per language and per mode stopped it."],["Invented facts","The model filled gaps with guesses. Few-shot examples, explicit rules against deduction and fixed bilingual fallback phrases keep it to what it was given."],["A microphone that moved","The USB microphone changed index between reboots. The code now finds it by name."],["Arabic speech recognition","It was unreliable at this model size, so I documented the limit and left it out instead of shipping a silent failure."]],outcome:"Stable offline operation, checked with automated stress tests that log every run to CSV. Delivered over four Scrum sprints with a specification, a roadmap and handoff documentation in English and French. I now work with TEKonsult part-time to integrate the stack into the production robot as its fallback when power or connectivity drops."}},{id:"heritage",title:"Tunisian heritage chatbot",subtitle:"Retrieval-augmented answers about archaeological sites",year:"2025",kicker:"Personal project",status:{label:"Complete",tone:"done"},summary:"A chatbot for questions about archaeological sites in Tunisia, from Carthage to Dougga. It retrieves passages from a document base first, then lets a local model answer from them in French, English or Arabic.",metrics:[["48","source documents on Tunisian sites"],["559","text chunks in the vector index"],["3","answer languages: French, English, Arabic"]],stack:["Python","Ollama","llama3","ChromaDB","sentence-transformers","Streamlit","Folium"],repo:"https://github.com/Mayma9/chatbot-archeologie-tunisie",notes:{problem:"Language models answer questions about heritage sites fluently, and not always correctly. I wanted answers that could be traced back to a source.",built:"Documents are cleaned, cut into overlapping 800-character chunks, embedded with a multilingual MPNet sentence-transformer and indexed in ChromaDB with cosine similarity. At question time the app detects the language, retrieves the closest chunks and hands them to llama3 running under Ollama. A Streamlit interface adds an interactive map of the sites, side-by-side site comparison, PDF export of a conversation and a feedback log.",outcome:"The whole pipeline runs on the local machine. A test script records response time, the similarity of the retrieved sources and a hallucination-risk rating for each answer."}},{id:"threatlens",title:"ThreatLens",subtitle:"Threat-intelligence data warehouse with AI-based analytics",year:"2026",kicker:"Semester project, team of two",status:{label:"In progress, final review in December",tone:"progress"},summary:"ThreatLens collects public cyber threat intelligence (CVE, KEV, EPSS, NVD, CWE, ATT&CK, ThreatFox) through an ETL pipeline into a PostgreSQL warehouse, then turns it into decisions with a Django triage console, Power BI reports and three machine-learning models.",metrics:[["8","public threat-intelligence sources in scope"],["3","models: CVE severity, exploitation, APT clustering"],["4","sprints, with me as Scrum Master"]],stack:["Python 3.13","Django 6.1","Django REST Framework","PostgreSQL","pandas","scikit-learn","Power BI Desktop","Docker Compose","GitHub Projects"],repo:"https://github.com/Mayma9/threatlens",notes:{problem:"Threat intelligence arrives as separate feeds in different formats. A security team needs them in one place, matched against the products it actually runs, and ranked by what to fix first.",built:"I lead the CVE List V5 connector and the Django triage console: vulnerability search, an enriched CVE record (CVSS by provider, EPSS, KEV, CWE, affected products), a watchlist, and alerts sorted by a priority score. My teammate leads the other connectors, data quality and the constellation warehouse. We share the three models, the Power BI reports, code reviews, tests and documentation.",outcome:"Four sprints from October to December 2026: foundations, full integration and first alerts, machine learning and prioritisation, finalisation. The final review is on 10 December 2026."}},{id:"metabric",title:"From genes to prognosis",subtitle:"Predicting breast-cancer mortality from clinical and genomic data",year:"2026",kicker:"Machine-learning capstone, team of two",status:{label:"In progress",tone:"progress"},summary:"Do gene expression and mutations predict breast-cancer death better than clinical data alone, and better than the Nottingham Prognostic Index that oncologists already use? We test it on the METABRIC cohort.",metrics:[["1,904","patients in the METABRIC cohort"],["693","columns: clinical, gene expression, mutations"]],facts:[["Baseline","Nottingham Prognostic Index"]],stack:["Python","scikit-learn","XGBoost","LightGBM","pandas","NumPy","matplotlib","seaborn","Jupyter"],repo:"https://github.com/Mayma9/metabric-ml1-project",notes:{problem:"Clinicians already use a prognostic score, the NPI, built from tumour size, grade and lymph-node status. The open question is whether genomic data adds predictive value on top of the clinical picture.",built:"A binary classifier for death from the disease, with classical machine learning only. The exploratory analysis is done: missing values, target balance, a leakage check, outliers, clinical correlations, gene expression against the target, and mutations. Preprocessing, modelling and a single end-to-end pipeline notebook follow, with every random seed fixed.",outcome:"In progress. It ends with a report and an oral defense in front of a jury."}},{id:"routounes",title:"Routounes",subtitle:"Public transport app for Tunis",year:"2025–26",kicker:"Year project, team of four",status:{label:"Complete",tone:"done"},summary:"A Spring Boot web application for public transport in Tunis: routes and schedules, ticketing with automatic expiry, an admin dashboard, and an interface in French, English and Arabic.",metrics:[["17","UML diagrams across the 4+1 views"],["3","interface languages"],["3","triggers that catch an expired ticket"]],stack:["Java 25","Spring Boot 3.5","Spring Security","Thymeleaf","MySQL 8","Bootstrap 5","Leaflet.js"],notes:{problem:"Commuters in Tunis need routes, schedules and tickets in one place, and operators need a dashboard to manage them.",built:"A layered Spring Boot application with server-side rendering in Thymeleaf, Spring Security for access control, MySQL for storage and Leaflet for maps.",hard:[["Tickets that never expired","Tickets stayed active past their date. I rebuilt the cleanup service around three triggers: a catch-up at startup, an hourly schedule and a manual action on the admin dashboard."],["Routes answering 404","A class-level route prefix collided with method-level paths and doubled the URL. I traced it and corrected the mappings."],["Three languages","Every label lives in message files for French, English and Arabic, down to the admin confirmation dialogs."]],outcome:"Specified with 17 UML diagrams covering the five views of Kruchten's 4+1 model, and prepared with the team for the end-of-year defense."}}],h=[{title:"StageMatch",year:"2026, in progress",stack:".NET · team of two",text:"AI matching platform for final-year internships, built as the group project of my n-tier architecture course."},{title:"Mystery Box",year:"2025",stack:"PHP · MySQL · JavaScript",text:"Puzzle game platform with front-end logic in JavaScript and a PHP and MySQL backend for sessions and saved state."},{title:"Car rental management system",year:"2025",stack:"C++ · Qt",text:"Desktop application for vehicle inventory, customer records and rental transactions, with a Qt interface on an object-oriented model."}],m=[{id:"robot",label:"Offline robot"},{id:"heritage",label:"Heritage chatbot"},{id:"threatlens",label:"ThreatLens"},{id:"metabric",label:"METABRIC"},{id:"routounes",label:"Routounes"},{id:"earlier",label:"More builds"}],g=[{group:"AI and language models",rows:[["Local LLMs with Ollama",["robot","heritage"]],["RAG, embeddings, vector search",["heritage"]],["Prompt design and guardrails",["robot","heritage"]],["Speech: Whisper, Piper",["robot"]]]},{group:"Data and machine learning",rows:[["Python",["robot","heritage","threatlens","metabric"]],["Machine learning (scikit-learn, XGBoost)",["threatlens","metabric"]],["ETL and data warehousing",["threatlens"]],["Power BI",["threatlens"]],["SQL (PostgreSQL, MySQL, SQLite)",["robot","threatlens","routounes","earlier"]]]},{group:"Backend and web",rows:[["Django",["threatlens"]],["Streamlit",["heritage"]],["Java, Spring Boot",["routounes"]],["Flask / FastAPI",["robot"]],["JavaScript, React",["robot","routounes","earlier"]],["PHP",["earlier"]],["C++, Qt",["earlier"]],["C#, .NET",["earlier"]]]},{group:"Systems and delivery",rows:[["Edge deployment (Jetson, Linux)",["robot"]],["Docker",["threatlens"]],["Stress and unit testing",[
